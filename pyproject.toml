[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscripts-local"
version = "1.3.0"
description = "Discover local Python scripts as lazy submodules and inspect their import graph with a GUI"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["python", "import", "module", "submodule", "discovery", "dependency-graph", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.0", "pytest>=8"]

[project.scripts]
autoscripts-cli = "autoscripts.cli:main"

[project.gui-scripts]
autoscripts-monitor = "autoscripts.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoscripts*"]
exclude = ["tests*", "examples*"]
